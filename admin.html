<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dhani Finance | Admin</title>
<style>
:root{--blue:#0759a6;--deep:#063a75;--line:#d7e6f4;--ink:#183653}*{box-sizing:border-box}body{margin:0;background:#f1f7fd;color:var(--ink);font-family:Arial,sans-serif}header{background:linear-gradient(120deg,#063a75,#087ac9);color:white;padding:20px 5%;font-size:22px;font-weight:bold}main{max-width:1200px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 7px 25px #0b4b8010}h2{font-size:19px;margin:0 0 12px;color:var(--deep)}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #c7d8e8;border-radius:8px}button{background:var(--blue);color:white;border:0;font-weight:bold;cursor:pointer}button.secondary{background:#e4f1ff;color:var(--deep)}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:190px}.hint{font-size:13px;color:#647b91}.message{padding:10px;border-radius:8px;margin:10px 0;background:#e8f7ef;color:#08603f}.error{background:#fff0f0;color:#9c2020}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:850px}th,td{text-align:left;border-bottom:1px solid #e3edf6;padding:10px;vertical-align:top}th{background:#edf6ff;color:#174a7b}.controls{display:grid;gap:8px;min-width:200px}.controls textarea{min-height:50px}.hidden{display:none}
</style></head><body><header>Dhani Finance — Admin Dashboard</header><main>
<section class="card"><h2>Admin Login</h2><p class="hint">Enter the ADMIN_PASSWORD configured in your hosting environment.</p><div class="row"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button id="login">Login / Refresh</button><button id="logout" class="secondary">Logout</button></div><div id="msg"></div></section>
<div id="dashboard" class="hidden">
<section class="card"><h2>Website Contact Number</h2><p class="hint">This number will be shown on the public website after saving.</p><div class="row"><input id="contactPhone" placeholder="+91 98765 43210" maxlength="30"><button id="savePhone">Save Contact Number</button></div></section>
<section class="card"><h2>Loan Enquiries</h2><div class="row"><input id="search" placeholder="Search name, mobile or reference"><button id="refresh" class="secondary">Refresh list</button></div><p id="count" class="hint"></p><div class="tablewrap"><table><thead><tr><th>Received</th><th>Reference</th><th>Customer</th><th>Contact</th><th>Loan enquiry</th><th>Status / admin note</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</div></main>
<script>
const $=id=>document.getElementById(id);let apps=[];
function msg(s,error=false){$('msg').className='message'+(error?' error':'');$('msg').textContent=s}
function headers(){return {'Content-Type':'application/json','x-admin-password':$('password').value}}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
$('login').onclick=load;$('refresh').onclick=load;$('logout').onclick=()=>{$('password').value='';$('dashboard').classList.add('hidden');$('rows').innerHTML='';msg('Logged out.')};
async function load(){try{const d=await api('/api/admin/applications');apps=d.applications;$('contactPhone').value=d.contactPhone||'';$('dashboard').classList.remove('hidden');msg('Admin access verified.');render()}catch(e){$('dashboard').classList.add('hidden');msg(e.message,true)}}
$('savePhone').onclick=async()=>{try{const d=await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({contactPhone:$('contactPhone').value})});msg('Contact number saved.')}catch(e){msg(e.message,true)}};
$('search').addEventListener('input',render);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.toLowerCase();const filtered=apps.filter(a=>[a.fullName,a.mobile,a.reference,a.email].some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent=filtered.length+' of '+apps.length+' applications';$('rows').innerHTML=filtered.map(a=>`<tr><td>${esc(new Date(a.createdAt).toLocaleString())}</td><td><b>${esc(a.reference)}</b></td><td>${esc(a.fullName)}<br><span class="hint">${esc(a.state||'')}</span></td><td>${esc(a.mobile)}<br>${esc(a.email||'')}</td><td>${esc(a.loanType)}<br>₹${Number(a.loanAmount).toLocaleString('en-IN')}<br><span class="hint">${esc(a.employment||'')}</span></td><td><div class="controls"><select id="s-${esc(a.reference)}">${['Application Received','Under Review','Documents Required','Verification in Progress','On Hold','Approved','Rejected','Closed'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select><textarea id="n-${esc(a.reference)}" placeholder="Customer-visible update (optional)">${esc(a.adminNote||'')}</textarea></div></td><td><button onclick="saveStatus('${esc(a.reference)}')">Save status</button></td></tr>`).join('')||'<tr><td colspan="7">No matching enquiries.</td></tr>'}
window.saveStatus=async ref=>{try{await api('/api/admin/applications/'+encodeURIComponent(ref),{method:'PATCH',body:JSON.stringify({status:$('s-'+ref).value,adminNote:$('n-'+ref).value})});msg('Status updated for '+ref+'.');await load()}catch(e){msg(e.message,true)}};
</script></body></html>
